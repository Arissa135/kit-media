<!-- GANTIKAN BAHAGIAN MODAL 3 (DASHBOARD GURU) DENGAN KOD INI -->
  <div class="modal-backdrop hidden" id="teacher-dashboard-modal" role="dialog" aria-modal="true" aria-labelledby="teacher-dash-title">
    <div class="modal-card is-wide">
      <div class="panel-header">
        <div>
          <p class="kicker" id="dash-school-kicker">SISTEM ANALITIK GURU // PAPARAN REKOD MURID</p>
          <h2 class="panel-title" id="teacher-dash-title">Dashboard Prestasi Murid</h2>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-neon is-cyan is-sm" id="btn-copy-student-link" onclick="copyStudentMagicLink()">
            Salin Pautan Khas Murid
          </button>
          <button type="button" class="btn-neon is-sm" onclick="toggleChangePinDrawer()">
            Tukar Kata Laluan Guru
          </button>
          <button type="button" class="btn-neon is-cyan is-sm" onclick="refreshTeacherSubmissions()">
            Segar Semula
          </button>
          <button type="button" class="btn-neon is-yellow is-sm" onclick="exportTeacherCsv()">
            Eksport CSV (Excel)
          </button>
          <button type="button" class="btn-neon is-sm" onclick="closeTeacherDashboard()">
            Log Keluar
          </button>
        </div>
      </div>

      <!-- Laci Tukar Kata Laluan / PIN Guru -->
      <div class="formula-box hidden" id="change-pin-drawer" style="border-left-color: var(--primary);">
        <div class="panel-header">
          <span class="hud-label" style="color: var(--primary);">TETAPAN KESELAMATAN // TUKAR KATA LALUAN GURU</span>
          <button type="button" class="btn-neon is-sm" onclick="toggleChangePinDrawer()">Tutup</button>
        </div>
        <form class="toolbar-inputs" onsubmit="handleChangeTeacherPin(event)">
          <div class="input-group">
            <label class="input-label" for="old-teacher-pin">Kata Laluan Semasa</label>
            <input type="password" id="old-teacher-pin" class="text-input" style="min-height: 38px;" required>
          </div>
          <div class="input-group">
            <label class="input-label" for="new-teacher-pin">Kata Laluan Baharu (Min 4 aksara)</label>
            <input type="password" id="new-teacher-pin" class="text-input" style="min-height: 38px;" minlength="4" required>
          </div>
          <div class="input-group">
            <label class="input-label" for="confirm-teacher-pin">Sahkan Kata Laluan Baharu</label>
            <input type="password" id="confirm-teacher-pin" class="text-input" style="min-height: 38px;" minlength="4" required>
          </div>
          <button type="submit" class="btn-neon is-cyan is-sm" id="btn-save-new-pin">Simpan Kata Laluan</button>
        </form>
        <p class="hint-text hidden" id="change-pin-status" style="margin-top: 0.5rem;"></p>
      </div>

      <!-- Summary KPI for Teacher -->
      <div class="report-stats" id="teacher-kpi-row"></div>

      <!-- Filter Toolbar -->
      <div class="teacher-toolbar">
        <div class="toolbar-inputs">
          <div class="input-group">
            <label class="input-label" for="dash-session-display">Kod Sesi Aktif (Terkunci)</label>
            <input type="text" id="dash-session-display" class="text-input" style="min-height: 38px; width: 180px;" disabled>
          </div>
          <div class="input-group">
            <label class="input-label" for="dash-class-filter">Tapis Ikut Kelas / Nama</label>
            <input type="text" id="dash-class-filter" class="text-input" style="min-height: 38px; width: 200px;" placeholder="Cari kelas atau murid..." oninput="renderTeacherTable()">
          </div>
        </div>
        <div>
          <button type="button" class="btn-neon is-sm" id="btn-clear-session-records" onclick="handleClearTeacherRecords(this)">
            Padam Rekod Sesi Ini
          </button>
        </div>
      </div>

      <!-- Student Records Table -->
      <div class="table-wrap">
        <table class="teacher-table">
          <thead>
            <tr>
              <th>Bil</th>
              <th>Nama Murid</th>
              <th>Kelas</th>
              <th>Status</th>
              <th>Skor</th>
              <th>PIN Selesai</th>
              <th>Kuantum / Vektor / Matriks</th>
              <th>Masa</th>
              <th>Petunjuk / Cubaan</th>
              <th>Masa Hantar</th>
            </tr>
          </thead>
          <tbody id="teacher-table-body">
            <tr>
              <td colspan="10" style="text-align: center; padding: 1.5rem; color: var(--on-surface-variant);">
                Memuatkan rekod murid...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
